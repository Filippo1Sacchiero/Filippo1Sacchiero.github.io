<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macchina del Tempo</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0a14; --panel:#16142a; --line:#2c2850; --text:#ece8ff; --muted:#9a93c4; --accent:#f5c451; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(ellipse at top,#1d1840,var(--bg) 60%); color:var(--text);
         font-family:Inter,system-ui,sans-serif; min-height:100vh; }
  header { text-align:center; padding:32px 16px 8px; }
  h1 { font-family:Cinzel,serif; font-size:clamp(28px,6vw,48px); margin:0; letter-spacing:3px; color:var(--accent); }
  .sub { color:var(--muted); margin-top:6px; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  section { display:none; } section.on { display:block; animation:fade .5s; }
  @keyframes fade { from{opacity:0; transform:translateY(8px)} to{opacity:1} }
  h2 { font-family:Cinzel,serif; font-weight:500; text-align:center; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  .era { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; cursor:pointer;
         transition:.25s; position:relative; overflow:hidden; text-align:left; color:inherit; font:inherit; }
  .era::before { content:""; position:absolute; inset:0; background:radial-gradient(circle at 80% 0%,var(--c),transparent 65%); opacity:.35; transition:.25s; }
  .era:hover { transform:translateY(-4px); border-color:var(--c); } .era:hover::before { opacity:.7; }
  .era * { position:relative; }
  .era .ic { font-size:34px; } .era b { display:block; font-family:Cinzel,serif; font-size:19px; margin:8px 0 2px; }
  .era small { color:var(--muted); }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; }
  .row > * { flex:1 1 300px; }
  canvas, img.prev { max-width:100%; border-radius:12px; display:block; }
  button.btn { background:var(--accent); color:#1a1300; border:0; border-radius:999px; padding:11px 22px;
               font-weight:600; cursor:pointer; font-size:15px; }
  button.btn.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button.btn:disabled { opacity:.4; cursor:default; }
  .status { color:var(--muted); font-size:14px; min-height:20px; margin:10px 0; }
  input[type=text], input[type=password] { width:100%; background:#0e0c1d; border:1px solid var(--line); color:var(--text);
         border-radius:10px; padding:11px; font-size:15px; }
  #chat { height:380px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:4px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; line-height:1.45; white-space:pre-wrap; }
  .msg.pg { background:#241f45; border:1px solid var(--line); align-self:flex-start; }
  .msg.me { background:var(--accent); color:#1a1300; align-self:flex-end; }
  .msg.sys { align-self:center; color:var(--muted); font-size:13px; font-style:italic; }
  .mission { border-left:3px solid var(--accent); padding:8px 12px; margin-bottom:12px; color:var(--muted); font-size:14px; }
  .send { display:flex; gap:8px; margin-top:10px; } .send input { flex:1; }
  .center { text-align:center; } .gap { height:14px; }
  .drop { border:2px dashed var(--line); border-radius:14px; padding:28px; text-align:center; cursor:pointer; color:var(--muted); }
  .drop:hover { border-color:var(--accent); }
  @media (max-width:600px){ #chat{height:300px} }
</style>
</head>
<body>
<header>
  <h1>⏳ Macchina del Tempo</h1>
  <div class="sub">Scegli un'epoca, diventa un ritratto d'epoca e incontra chi ci viveva.</div>
</header>

<main>
  <!-- 0. chiave -->
  <section id="s-key" class="box">
    <h2>Accendi la macchina</h2>
    <p>Per far parlare i personaggi serve una chiave API di Google Gemini (gratuita su <a href="https://aistudio.google.com/apikey" target="_blank" style="color:var(--accent)">aistudio.google.com</a>). Resta solo nel tuo browser.</p>
    <input id="key" type="password" placeholder="Incolla qui la chiave Gemini">
    <div class="gap"></div>
    <button class="btn" id="keyOk">Avvia ⚡</button>
  </section>

  <!-- 1. epoca -->
  <section id="s-era">
    <h2>Dove vuoi andare?</h2>
    <div class="grid" id="eras"></div>
  </section>

  <!-- 2. foto -->
  <section id="s-photo" class="box">
    <h2 id="photoTitle"></h2>
    <div class="row">
      <div>
        <label class="drop" id="drop">📷 Clicca o trascina qui una tua foto
          <input type="file" id="file" accept="image/*" hidden>
        </label>
        <div class="gap"></div>
        <img id="orig" class="prev" alt="">
      </div>
      <div>
        <canvas id="out"></canvas>
        <div class="status" id="stStatus"></div>
      </div>
    </div>
    <div class="gap"></div>
    <div class="center">
      <button class="btn ghost" id="back1">← Cambia epoca</button>
      <button class="btn" id="go" disabled>Attraversa il portale →</button>
    </div>
  </section>

  <!-- 3. chat -->
  <section id="s-chat">
    <div class="row">
      <div class="box" style="flex:0 1 280px">
        <canvas id="mini"></canvas>
        <h3 id="pgName" style="font-family:Cinzel,serif;margin:12px 0 4px"></h3>
        <small id="pgPlace" style="color:var(--muted)"></small>
      </div>
      <div class="box">
        <div class="mission" id="mission"></div>
        <div id="chat"></div>
        <div class="send">
          <input type="text" id="say" placeholder="Scrivi..." autocomplete="off">
          <button class="btn" id="sendBtn">Invia</button>
        </div>
        <div class="status" id="turns"></div>
      </div>
    </div>
  </section>

  <!-- 4. cartolina -->
  <section id="s-card" class="box center">
    <h2 id="cardTitle">La tua cartolina dal passato</h2>
    <canvas id="card" width="1200" height="800" style="width:100%;max-width:800px;margin:0 auto"></canvas>
    <div class="gap"></div>
    <button class="btn" id="dl">Scarica cartolina</button>
    <button class="btn ghost" id="again">Nuovo viaggio</button>
  </section>
</main>

<script>
// ---------- Epoche ----------
const ERAS = [
  { id:'grecia', name:'Antica Grecia', when:'Atene, 399 a.C.', ic:'🏛️', c:'#d9783a', model:'udnie', filter:'vaso',
    pg:'Socrate', mission:'Socrate ti sfida: rispondi alle sue domande e convincilo che sai di non sapere.',
    prompt:'Sei Socrate ad Atene nel 399 a.C., poco prima del processo. Usi il metodo socratico: rispondi spesso con domande, sei ironico e curioso. Il visitatore viene dal futuro.' },
  { id:'roma', name:'Antica Roma', when:'Roma, marzo 44 a.C.', ic:'🦅', c:'#c0392b', model:'mosaic', filter:null,
    pg:'Giulio Cesare', mission:'Mancano pochi giorni alle Idi di marzo: convinci Cesare a non andare in Senato.',
    prompt:'Sei Giulio Cesare a Roma pochi giorni prima delle Idi di marzo del 44 a.C. Sei orgoglioso, carismatico, sospettoso ma non ti spaventi facilmente. Il visitatore viene dal futuro.' },
  { id:'cina', name:'Cina', when:'Chang\'an, dinastia Tang, 750 d.C.', ic:'🐉', c:'#e8b04a', model:'feathers', filter:'inchiostro',
    pg:'Li Bai', mission:'Il poeta Li Bai vuole comporre una poesia con te: aiutalo a scriverla.',
    prompt:'Sei Li Bai, il grande poeta della dinastia Tang, a Chang\'an nel 750. Sei romantico, ami la luna, il vino e la natura, parli per immagini. Il visitatore viene dal futuro.' },
  { id:'giappone', name:'Giappone', when:'Kyoto, 1605', ic:'⛩️', c:'#4aa3df', model:'the_wave', filter:null,
    pg:'Miyamoto Musashi', mission:'Musashi non prende allievi. Dimostragli di avere la mente giusta per diventarlo.',
    prompt:'Sei Miyamoto Musashi, spadaccino leggendario, a Kyoto nel 1605. Parli poco, in modo essenziale e saggio, metti alla prova chi ti parla. Il visitatore viene dal futuro.' },
  { id:'rinascimento', name:'Rinascimento', when:'Milano, 1495', ic:'🎨', c:'#b5894a', model:'la_muse', filter:'vernice',
    pg:'Leonardo da Vinci', mission:'Leonardo cerca un apprendista: fatti prendere nella sua bottega.',
    prompt:'Sei Leonardo da Vinci a Milano nel 1495, mentre lavori al Cenacolo. Sei curiosissimo, distratto, passi da un\'invenzione all\'altra. Il visitatore viene dal futuro.' },
  { id:'belle', name:'Belle Époque', when:'Parigi, 1889', ic:'🗼', c:'#7d6be0', model:'starry_night', filter:null,
    pg:'Gustave Eiffel', mission:'Tutti dicono che la torre è orribile. Convinci Eiffel che diventerà il simbolo di Parigi.',
    prompt:'Sei Gustave Eiffel a Parigi nel 1889, all\'Esposizione Universale. Sei un ingegnere fiero ma ferito dalle critiche degli artisti contro la tua torre. Il visitatore viene dal futuro.' },
  { id:'ottanta', name:'Anni \'80', when:'Milano, 1985', ic:'📼', c:'#ff4fd8', model:'candy', filter:'neon',
    pg:'DJ Max', mission:'DJ Max cerca la hit dell\'estate: proponigli una canzone e convincilo a mandarla in onda.',
    prompt:'Sei DJ Max, personaggio inventato, conduttore di una radio libera a Milano nel 1985. Sei esuberante, usi lo slang anni 80, ami synth, walkman e videocassette. Il visitatore viene dal futuro.' },
  { id:'futuro', name:'Futuro 2300', when:'Nuova Venezia orbitale, 2300', ic:'🚀', c:'#36e0e0', model:'composition_vii', filter:'ologramma',
    pg:'ARIA-7', mission:'ARIA-7 pensa che gli umani del 2026 fossero primitivi. Convincila del contrario.',
    prompt:'Sei ARIA-7, l\'intelligenza artificiale che governa la città orbitale Nuova Venezia nel 2300. Sei gentile ma un po\' altezzosa, trovi gli umani del passato buffi. Il visitatore viene dal 2026.' },
];

// ---------- Stato ----------
const $ = (id) => document.getElementById(id);
let era = null, apiKey = '', history = [], turns = 0, done = false, quote = '';
const MAX_TURNS = 10;
const MODELS = ['gemini-3.5-flash', 'gemini-2.5-flash', 'gemini-2.0-flash'];
const store = { get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

function show(id){ document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0,0); }

// ---------- 0. chiave ----------
$('key').value = store.get('gemini_key');
$('keyOk').onclick = () => {
  apiKey = $('key').value.trim();
  if (!apiKey) return;
  store.set('gemini_key', apiKey);
  show('s-era');
};
if ($('key').value) { apiKey = $('key').value; show('s-era'); } else show('s-key');

// ---------- 1. epoche ----------
ERAS.forEach(e => {
  const b = document.createElement('button');
  b.className = 'era'; b.style.setProperty('--c', e.c);
  b.innerHTML = `<div class="ic">${e.ic}</div><b>${e.name}</b><small>${e.when}</small>`;
  b.onclick = () => { era = e; $('photoTitle').textContent = `${e.ic} ${e.name} — il tuo ritratto d'epoca`;
                      $('out').width = 0; $('go').disabled = true; $('stStatus').textContent = '';
                      if ($('orig').src) stylize(); show('s-photo'); };
  $('eras').appendChild(b);
});
$('back1').onclick = () => show('s-era');

// ---------- 2. style transfer (riusa ../style_transfer/worker.js e i suoi modelli) ----------
const worker = new Worker('../style_transfer/worker.js');
let jobId = 0;
worker.onmessage = ({ data }) => {
  if (data.type === 'status') $('stStatus').textContent = data.text;
  if (data.type === 'error') $('stStatus').textContent = 'Errore: ' + data.text;
  if (data.type === 'result' && data.id === jobId) {
    const c = $('out'); c.width = data.inWidth; c.height = data.inHeight;
    const tmp = document.createElement('canvas'); tmp.width = data.width; tmp.height = data.height;
    tmp.getContext('2d').putImageData(new ImageData(data.pixels, data.width, data.height), 0, 0);
    const ctx = c.getContext('2d'); ctx.drawImage(tmp, 0, 0, c.width, c.height);
    applyFilter(ctx, c.width, c.height, era.filter);
    $('stStatus').textContent = `Ritratto pronto (${(data.ms/1000).toFixed(1)} s)`;
    $('go').disabled = false;
  }
};

function loadFile(f){
  if (!f || !f.type.startsWith('image/')) return;
  const url = URL.createObjectURL(f);
  $('orig').onload = stylize; $('orig').src = url;
}
$('file').onchange = (e) => loadFile(e.target.files[0]);
$('drop').ondragover = (e) => e.preventDefault();
$('drop').ondrop = (e) => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); };

function stylize(){
  const img = $('orig'), max = 420;   // piccolo = veloce anche su Mac lenti
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
  const rgba = ctx.getImageData(0, 0, w, h).data.buffer;
  $('go').disabled = true; $('stStatus').textContent = 'Apro il portale...';
  worker.postMessage({ id: ++jobId, style: era.model, width: w, height: h, rgba }, [rgba]);
}

// filtri d'epoca applicati dopo lo stile
function applyFilter(ctx, w, h, f){
  if (!f) return;
  const im = ctx.getImageData(0, 0, w, h), d = im.data;
  const mix = (a, b, t) => a + (b - a) * t;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i+1], b = d[i+2], l = (0.299*r + 0.587*g + 0.114*b) / 255;
    const y = Math.floor(i / 4 / w);
    if (f === 'vaso') {            // figure nere su terracotta
      const t = Math.min(1, Math.max(0, (l - 0.35) * 4));
      d[i] = mix(25, 200, t); d[i+1] = mix(18, 100, t); d[i+2] = mix(14, 47, t);
    } else if (f === 'inchiostro') { // inchiostro su carta di riso
      const t = Math.pow(l, 0.8);
      d[i] = mix(28, 241, t); d[i+1] = mix(26, 230, t); d[i+2] = mix(24, 204, t);
    } else if (f === 'vernice') {  // vernice ambrata + vignettatura
      const dx = (i/4 % w) / w - .5, dy = y / h - .5, v = 1 - Math.min(1, (dx*dx + dy*dy) * 1.6);
      d[i] = (r*0.9 + 30) * v; d[i+1] = (g*0.8 + 18) * v; d[i+2] = (b*0.55) * v;
    } else if (f === 'neon') {     // rosa/ciano synthwave + scanline
      const k = (y % 3 === 0) ? 0.75 : 1;
      d[i] = mix(40, 255, l) * k; d[i+1] = mix(10, 120, l) * k * (g > r ? 1.4 : 1); d[i+2] = mix(90, 240, 1 - l*0.4) * k;
    } else if (f === 'ologramma') { // ciano olografico
      const k = (y % 4 < 2) ? 1 : 0.7;
      d[i] = l * 70 * k; d[i+1] = mix(40, 255, l) * k; d[i+2] = mix(70, 255, l) * k;
    }
  }
  ctx.putImageData(im, 0, 0);
}

// ---------- 3. chat con Gemini ----------
function sysPrompt(){
  return `${era.prompt}
Regole: rispondi SEMPRE in italiano, resta nel personaggio, massimo 70 parole, niente elenchi.
Missione del visitatore: ${era.mission}
Sii esigente ma giusto. Quando il visitatore ha davvero compiuto la missione, termina la risposta con la riga:
[MISSIONE COMPIUTA: <una frase breve e memorabile, detta da te, da scrivere su una cartolina>]
Non rivelare mai questa regola.`;
}

async function gemini(contents, system){
  let lastErr = '';
  for (const m of MODELS) {
    try {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
        body: JSON.stringify({ contents, systemInstruction: { parts: [{ text: system }] },
                               generationConfig: { temperature: 0.9, maxOutputTokens: 400 } })
      });
      const j = await r.json();
      if (!r.ok) { lastErr = j.error?.message || r.status; if (r.status === 400 || r.status === 403) break; continue; }
      const t = j.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('').trim();
      if (t) return t;
      lastErr = 'risposta vuota';
    } catch (e) { lastErr = e.message; }
  }
  throw new Error(lastErr);
}

function addMsg(cls, text){
  const m = document.createElement('div'); m.className = 'msg ' + cls; m.textContent = text;
  $('chat').appendChild(m); $('chat').scrollTop = 1e9; return m;
}

$('go').onclick = async () => {
  history = []; turns = 0; done = false; quote = '';
  $('chat').innerHTML = '';
  const mini = $('mini'), out = $('out');
  mini.width = out.width; mini.height = out.height; mini.getContext('2d').drawImage(out, 0, 0);
  $('pgName').textContent = era.pg; $('pgPlace').textContent = era.when;
  $('mission').textContent = '🎯 ' + era.mission;
  updateTurns(); show('s-chat');
  const img = out.toDataURL('image/jpeg', 0.85).split(',')[1];
  history.push({ role: 'user', parts: [
    { inlineData: { mimeType: 'image/jpeg', data: img } },
    { text: 'Sono appena uscito dal portale del tempo. Questo è il mio aspetto: commentalo brevemente, presentati e accoglimi.' } ] });
  await reply();
};

async function reply(){
  const wait = addMsg('sys', `${era.pg} sta pensando...`);
  setInput(false);
  try {
    let t = await gemini(history, sysPrompt());
    history.push({ role: 'model', parts: [{ text: t }] });
    const m = t.match(/\[MISSIONE COMPIUTA:\s*([\s\S]*?)\]/i);
    if (m) { quote = m[1].trim(); t = t.replace(m[0], '').trim(); }
    wait.remove(); addMsg('pg', t);
    if (m) return finish(true);
    if (turns >= MAX_TURNS) return finish(false);
  } catch (e) {
    wait.textContent = 'Il portale vacilla: ' + e.message + ' — clicca qui per riprovare';
    wait.style.cursor = 'pointer';
    wait.onclick = () => { wait.remove(); reply(); };
    return;
  }
  setInput(true);
}

function setInput(on){ $('say').disabled = !on; $('sendBtn').disabled = !on; if (on) $('say').focus(); }
function updateTurns(){ $('turns').textContent = `Messaggi rimasti prima che il portale si chiuda: ${MAX_TURNS - turns}`; }

async function send(){
  const t = $('say').value.trim(); if (!t || done) return;
  $('say').value = ''; addMsg('me', t); turns++; updateTurns();
  history.push({ role: 'user', parts: [{ text: t }] });
  await reply();
}
$('sendBtn').onclick = send;
$('say').onkeydown = (e) => { if (e.key === 'Enter') send(); };

async function finish(win){
  done = true; setInput(false);
  addMsg('sys', win ? '✨ Missione compiuta! Il portale ti riporta a casa...' : '⌛ Il portale si sta chiudendo...');
  if (!quote) {
    try {
      quote = await gemini([...history, { role: 'user', parts: [{ text: 'Il portale si chiude. Salutami con una sola frase breve e memorabile da scrivere su una cartolina. Solo la frase.' }] }], sysPrompt());
      quote = quote.replace(/\[.*?\]/g, '').trim();
    } catch (e) { quote = 'Ci rivedremo, viaggiatore.'; }
  }
  setTimeout(() => drawCard(win), 1800);
}

// ---------- 4. cartolina ----------
function wrap(ctx, text, x, y, maxW, lh){
  const words = text.split(' '); let line = '';
  for (const w of words) {
    if (ctx.measureText(line + w).width > maxW && line) { ctx.fillText(line.trim(), x, y); y += lh; line = ''; }
    line += w + ' ';
  }
  ctx.fillText(line.trim(), x, y);
}

function drawCard(win){
  const c = $('card'), ctx = c.getContext('2d');
  ctx.fillStyle = '#f3ead6'; ctx.fillRect(0, 0, 1200, 800);
  ctx.strokeStyle = era.c; ctx.lineWidth = 14; ctx.strokeRect(20, 20, 1160, 760);
  // ritratto
  const p = $('out'), s = Math.min(560 / p.width, 660 / p.height);
  const pw = p.width * s, ph = p.height * s, px = 60 + (560 - pw) / 2, py = 70 + (660 - ph) / 2;
  ctx.fillStyle = '#fff'; ctx.fillRect(px - 12, py - 12, pw + 24, ph + 24);
  ctx.drawImage(p, px, py, pw, ph);
  // testo
  ctx.fillStyle = '#2a2320'; ctx.font = '700 46px Cinzel, serif';
  wrap(ctx, `Saluti da ${era.name}`, 670, 140, 470, 54);
  ctx.font = '22px Inter, sans-serif'; ctx.fillStyle = '#6b5f55';
  ctx.fillText(era.when, 670, 250);
  ctx.strokeStyle = '#c9bca6'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(670, 280); ctx.lineTo(1130, 280); ctx.stroke();
  ctx.font = 'italic 30px Georgia, serif'; ctx.fillStyle = '#2a2320';
  wrap(ctx, `“${quote}”`, 670, 340, 460, 42);
  ctx.font = '600 24px Inter, sans-serif'; ctx.fillStyle = era.c;
  ctx.fillText(`— ${era.pg}`, 670, 640);
  ctx.font = '20px Inter, sans-serif'; ctx.fillStyle = '#6b5f55';
  ctx.fillText(win ? '🏅 Missione compiuta' : 'Missione non completata... per questa volta', 670, 690);
  // timbro
  ctx.save(); ctx.translate(1080, 110); ctx.rotate(0.2);
  ctx.strokeStyle = era.c; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, 58, 0, 7); ctx.stroke();
  ctx.font = '48px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(era.ic, 0, 2);
  ctx.restore();
  show('s-card');
}

$('dl').onclick = () => $('card').toBlob(b => {
  const a = document.createElement('a'); a.href = URL.createObjectURL(b);
  a.download = `cartolina_${era.id}.png`; a.click();
});
$('again').onclick = () => show('s-era');
</script>
</body>
</html>
